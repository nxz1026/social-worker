<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>社工管理 · 项目材料</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<!-- 登录 -->
<div id="loginCard" class="login-wrap">
  <form class="login-card" id="loginForm" autocomplete="on">
    <div class="login-brand"><span class="brand-mark">社</span></div>
    <h1>社工管理</h1>
    <p class="muted">项目 · 活动 · 材料生成</p>
    <label class="field">
      <span>用户名</span>
      <input id="loginUser" name="username" autocomplete="username" required>
    </label>
    <label class="field">
      <span>密码</span>
      <input id="loginPass" name="password" type="password" autocomplete="current-password" required>
    </label>
    <div class="err" id="loginErr"></div>
    <button id="btnLogin" class="btn primary block" type="submit">登录</button>
  </form>
</div>

<!-- 主界面 -->
<div id="appShell" class="app hidden">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="brand-mark">社</span>
      <span class="brand-text">社工管理</span>
    </div>
    <nav id="sidebarNav" class="nav"></nav>
    <div class="sidebar-foot">
      <span class="who" id="me"></span>
      <button id="btnLogout" class="btn ghost sm" type="button">退出</button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button id="btnToggleSidebar" class="icon-btn" type="button" title="收起 / 展开侧边栏" aria-label="收起或展开侧边栏">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <h1 id="pageTitle">仪表盘</h1>
      <div class="topbar-right">
        <span class="muted">项目 → 活动 → 材料</span>
      </div>
    </header>
    <main id="view" class="view"></main>
  </div>
</div>

<!-- 弹窗 -->
<div id="modal" class="modal hidden" role="dialog" aria-modal="true">
  <div class="modal-box">
    <div class="modal-head">
      <h2 id="modalTitle"></h2>
      <button class="icon-btn" type="button" data-close-modal aria-label="关闭">×</button>
    </div>
    <div id="modalBody" class="modal-body"></div>
    <div id="modalFoot" class="modal-foot"></div>
  </div>
</div>

<!-- 提示 -->
<div id="toasts" class="toasts" aria-live="polite"></div>

<script src="util.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
