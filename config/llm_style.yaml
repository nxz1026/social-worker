# LLM 文风配置
#
# 查找顺序：SOCIAL_WORK_LLM_STYLE → <repo>/config/llm_style.yaml → <root>/config/llm_style.yaml
# 项目 yaml 里的 llm_style 字段可以覆盖这里的 default 与 styles 中同名项。
#
# 每种文风 = 若干篇真实样例（few-shot） + 附加要求（拼进 prompt 末尾）
# 样例路径相对 engine/llm_styles/，文件内容是纯文本，原样塞进 prompt。

default: 务实

styles:
  务实:
    desc: 开门见山讲问题和做法，带具体数字与场景，不喊口号
    examples:
      - 务实/共治行动.txt
      - 务实/志愿服务.txt
    extra: |
      - 第一段先说"哪里有问题、谁有诉求"，用具体场景，不用"深入贯彻落实"这类开头
      - 过程段按环节顺序写，每个环节给出可核对的细节（谁做了什么、说了什么、结果如何）
      - 成效段讲清楚"从什么变成什么"，不堆形容词
      - 全文不出现"营造出…浓厚氛围""打造…新格局""双向奔赴"这类套话

  平实:
    desc: 日期开头，白话叙述，像向邻居汇报
    examples:
      - 平实/花都围巾.txt
    extra: |
      - 开头用"X月X日，某社区联同某机构开展…"的句子直接进入事件
      - 少用书面语，多用"大家""一起""把这事办了"这类日常表达
      - 不写升华句，事说完就收

  党建:
    desc: 政治站位在前，句式工整，但必须落到具体事上
    examples:
      - 党建/梅州红心向党.txt
      - 党建/盐南凤开小舞台.txt
    extra: |
      - 开头可用"为庆祝/为深入贯彻…，近日，某社区联同某机构开展…"
      - 首段末句可写"营造出…浓厚氛围，进一步夯实…基础，打造有温度、有力量、有底色的…新格局"
      - 末段写"下一步，将持续以…为抓手，…切实增强居民的获得感、幸福感、安全感"
      - 中间段必须写具体动作和场景，不许只有口号
      - 全文真实信息（数字、环节、结果）不得因文风而丢失

# 活动类型 → 默认文风。项目 yaml 没配 llm_style 时按这里取
type_style:
  爱邻议事会: 务实
  共治行动: 务实
  志愿服务: 务实
  队伍赋能培训: 务实
  情境式游园会: 务实
  知识竞赛: 平实
  花都龙门阵: 务实
  走访调研: 务实
  联盟成立大会: 务实
  街区氛围营造: 务实
  项目成果展: 党建
  激励表彰: 党建
