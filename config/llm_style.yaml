# LLM 文风配置
#
# 查找顺序：SOCIAL_WORK_LLM_STYLE → <repo>/config/llm_style.yaml → <root>/config/llm_style.yaml
# 项目 yaml 里的 llm_style 字段可以覆盖这里的 default 与 styles 中同名项。
#
# 每种文风 = 若干篇真实样例（few-shot） + 附加要求（拼进 prompt 末尾）
# 样例路径相对 engine/llm_styles/，文件内容是纯文本，原样塞进 prompt。

default: 务实

styles:
  务实:
    desc: 开门见山讲问题和做法，带具体数字与场景，不喊口号
    examples:
      - 务实/共治行动.txt
      - 务实/志愿服务.txt
    extra: |
      - 第一段先说"哪里有问题、谁有诉求"，用具体场景，不用"深入贯彻落实"这类开头
      - 过程段按环节顺序写，每个环节给出可核对的细节（谁做了什么、说了什么、结果如何）
      - 成效段讲清楚"从什么变成什么"，不堆形容词
      - 全文不出现"营造出…浓厚氛围""打造…新格局""双向奔赴"这类套话
    # 生成后的规则自检（engine.llm.self_check），不额外调 LLM
    check:
      forbidden:               # 命中即扣分
        - "为深入贯彻落实"
        - "浓厚氛围"
        - "双向奔赴"
        - "新格局"
      max_words: 900
      min_words: 550

  平实:
    desc: 日期开头，白话叙述，像向邻居汇报
    examples:
      - 平实/花都围巾.txt
    extra: |
      - 开头用"X月X日，某社区联同某机构开展…"的句子直接进入事件
      - 少用书面语，多用"大家""一起""把这事办了"这类日常表达
      - 不写升华句，事说完就收
    check:
      forbidden:
        - "为深入贯彻落实"
        - "浓厚氛围"
      max_words: 900
      min_words: 400

  党建:
    desc: 政治站位在前，句式工整，但必须落到具体事上
    examples:
      - 党建/梅州红心向党.txt
      - 党建/盐南凤开小舞台.txt
    # 以下是硬性要求，覆盖骨架的默认写法。不照做即视为不合格。
    overwrite_skeleton: true
    extra: |
      【本段为硬性要求，优先级高于下面的段落骨架。冲突时以本段为准。】

      导语段：
      - 必须以「为庆祝…」或「为深入贯彻落实…」或「为传承…」开头，这是硬要求
      - 导语段末尾必须补一句收束，含「营造出…浓厚氛围」与「进一步夯实…基础」两个短语
      - 导语段里仍要交代问题现状与谁有诉求，但用书面语承载，不用口语

      成效段：
      - 以「通过此次活动开展…」开头，讲清楚从什么变成什么
      - 成效段末尾必须追加一句以「下一步，」开头的展望，句式含「持续以…为抓手」与「切实增强居民的获得感、幸福感、安全感」
      - 这一句是本段的组成部分，不是额外加段

      过程段：
      - 必须写具体动作和场景，不许只有口号
      - 保留所有真实数字、环节、人物分工

      全文禁止：
      - 真实信息（数字、环节、结果）因文风而丢失或改写
    check:
      required_any:            # 至少命中 1 个
        - "为深入贯彻落实"
        - "为庆祝"
        - "为传承"
        - "为纪念"
      required_all:            # 必须全部命中
        - "浓厚氛围"
        - "夯实"
        - "获得感、幸福感、安全感"
        - "抓手"
      max_words: 900
      min_words: 550

# 活动类型 → 默认文风。项目 yaml 没配 llm_style 时按这里取
type_style:
  爱邻议事会: 务实
  共治行动: 务实
  志愿服务: 务实
  队伍赋能培训: 务实
  情境式游园会: 务实
  知识竞赛: 平实
  花都龙门阵: 务实
  走访调研: 务实
  联盟成立大会: 务实
  街区氛围营造: 务实
  项目成果展: 党建
  激励表彰: 党建
