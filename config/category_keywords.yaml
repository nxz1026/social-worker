# 类别识别关键词（M2 规则层）
#
# key 必须是 feishu-flow.yaml 里 categories 的六个之一。
# 「其他」没有关键词，规则永远不会判它 —— 落 LLM。
#
# 改这里就能调规则，不用改代码。

发票票据:
  - 发票
  - 收据
  - 报销
  - 采购
  - 费用
  - 票据
项目计划:
  - 方案
  - 申报
  - 立项
  - 策划
  - 预算
  - 申请书
项目执行:
  - 推文
  - 活动
  - 会议
  - 纪要
  - 进展
  - 总结
  - 培训
日常工作佐证:
  - 台账
  - 签到
  - 走访
  - 名单
  - 入户
  - 宣传栏
  - 微网实格
  - 关爱
  - 特殊人群
政策文件:
  - 政策
  - 法规
  - 通知
  - 办法
  - 标准
  - 规定
其他: []

# ---------- 正文「自报家门」关键词 ----------
# 文档自己说明了自己是什么。正文里命中就直接定类别，不管文件名写什么 ——
# 文件名常写活动名（「第三期活动礼品」「微议事第三期活动」），不写单据类型，
# 所以正文的自报比文件名可信。
# 只放不会歧义的词：「方案」「活动」「会议」在活动稿里也会出现，不能放进来。
strong:
  发票票据:
    - 发票
    - 收据
    - 价税合计
    - 开票日期
    - 发票号码
    - 纳税人识别号
  政策文件:
    - 政策文件
    - 红头文件
