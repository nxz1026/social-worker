# 实体名册
#
# 转换 md 时，脚本会把这里的名字在正文里包成 [[链接]]，让 Obsidian 图谱自动长边。
# 规则：
#   - 名字至少 2 个字
#   - 长的优先匹配（避免「张三丰」被「张三」截断）
#   - 代码块、行内代码、已有的 [[链接]] 里不会插
#   - 改完重跑 scripts/convert-md.py 即可生效
#
# 项目级补充：也可以放在 sources/projects/<项目>/entities.yaml，会与本文件合并。

projects:
  - 花都
  - 惠民

orgs: []
# 例：
#   - 向阳花
#   - 惠民社区

persons: []
# 例（一线社工通常用化名）：
#   - 张某
#   - 李某

places: []
